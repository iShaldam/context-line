name: dependabot auto-merge

# dependabot's github actions bumps merge themselves (rebase) once the test
# and zizmor checks pass on the pr's head. main has no required checks, so
# this job waits for them itself instead of trusting gh pr merge --auto. a
# failed, cancelled or missing check means no merge. nothing else auto-merges:
# other ecosystems and anyone who isn't dependabot get skipped

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.package-ecosystem == 'github_actions'
        run: |
          verdict='map(select(.name == "test" or .name == "zizmor"))
            | if any(.bucket == "fail" or .bucket == "cancel") then "fail"
              elif (map(.name) | unique) == ["test", "zizmor"] and all(.bucket == "pass") then "pass"
              else "wait" end'
          for _ in $(seq 50); do
            # exit 8 just means some check is still pending
            v=$(gh pr checks "$PR_URL" --json name,bucket --jq "$verdict") || true
            case "$v" in
              pass) exec gh pr merge --rebase --match-head-commit "$HEAD_SHA" "$PR_URL" ;;
              fail) echo "test or zizmor failed, not merging"; exit 1 ;;
            esac
            sleep 20
          done
          echo "test and zizmor never both passed, not merging"; exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
